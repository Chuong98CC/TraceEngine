[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trace-models"
version = "0.1.0"
description = "3D-vision inference on torch.export checkpoints — depth, pose, flow, tracking, and more."
# Floor of 3.12.1, not 3.12: multiprocess 0.70.19 (via lerobot) calls
# RLock._recursion_count, which only exists from 3.12.1 on; 3.12.0 crashes
# with an "Exception ignored" AttributeError at interpreter exit.
requires-python = ">=3.12.1, <3.13"
readme = "README.md"

dependencies = [
    "pre-commit",
    "trimesh",
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "einops",
    "huggingface_hub",
    "imageio",
    "numpy==2.2.6",
    "opencv-python",
    "open3d",
    "pycocotools",
    "typer",
    "pillow",
    "omegaconf",
    "evo",
    "e3nn",
    "moviepy",
    "plyfile",
    "pillow_heif",
    "safetensors",
    "uvicorn",
    "moviepy==1.0.3",
    "typer>=0.9.0",
    "pycolmap",
    "numba",
    "ninja", # build-time parallel backend for the vendored pointops2 CUDA extension
    "pointops2",
    "ftfy",
    "matplotlib",
    "regex",
    "ipykernel",
    "lerobot==0.6.1",
    "lerobot[dataset]",
    "lz4",
    "rich",
    "flex_gemm",
    "utils3d_moge",
]

[project.optional-dependencies]
data = ["pandas"]
dev = ["pre-commit", "pytest", "pytest-cov", "ruff"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
# pointops2's setup.py imports torch at build time, so it must build inside the
# project environment (no build isolation).
pointops2 = { path = "third_party/pointops2" }
# flex_gemm (FlexGEMM) has no PyPI release — git install at a pinned commit.
# Default build is pure-Triton (no compile); the optional CUDA extension
# (FLEX_GEMM_BUILD_CUDA=1) would additionally need no-build-isolation.
flex_gemm = { git = "https://github.com/JeffreyXiang/FlexGEMM.git", rev = "b2fadb29d41846c7981ade6801ffc689fae119cf" }
utils3d_moge ={git ="https://github.com/EasternJournalist/utils3d-moge.git", rev = "62f09d58509485564e24d5d9f6aac9ee9ebc0c37" }

[tool.uv]
# pointops2's setup.py imports torch at build time, so it must build inside the
# project environment (no build isolation).
no-build-isolation-package = ["pointops2"]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/depth_models", "src/flow_models", "src/utils", "src/det_seg_models", "tools"]

